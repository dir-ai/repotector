name: publish

# Publishes to npm with Sigstore provenance when a v* tag is pushed.
# Auth is OIDC "trusted publishing" (configured on npmjs.com) — no stored token.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm >= 11.5; Node's bundled npm is older.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm install --no-audit --no-fund
      - name: Sanity — the CLI runs and inits a repo
        run: |
          node --check bin/psx-repotector.mjs
          tmp=$(mktemp -d) && cp -r src bin intent.schema.json package.json "$tmp"/ && cd "$tmp"
          git init -q && git config user.email ci@ci && git config user.name ci && git add -A && git commit -qm init
          node bin/psx-repotector.mjs init
          node bin/psx-repotector.mjs gates | grep -q INTENT_HONORED
      - run: npm publish --provenance --access public
