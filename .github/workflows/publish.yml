name: publish

# On a v* tag: publish to npm with Sigstore provenance AND register on the
# official MCP registry — both via GitHub OIDC (trusted publishing / github-oidc),
# no stored secrets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # provenance + npm trusted publishing + MCP registry OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm >= 11.5; Node's bundled npm is older.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm install --no-audit --no-fund

      - name: Sanity — the CLI runs and inits a repo
        run: |
          node --check bin/psx-repotector.mjs
          tmp=$(mktemp -d) && cp -r src bin intent.schema.json package.json "$tmp"/ && cd "$tmp"
          git init -q && git config user.email ci@ci && git config user.name ci && git add -A && git commit -qm init
          node bin/psx-repotector.mjs init
          node bin/psx-repotector.mjs gates | grep -q INTENT_HONORED

      - name: Publish to npm (provenance via trusted publishing)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "repotector@$V" version >/dev/null 2>&1; then
            echo "repotector@$V already on npm — skipping (registry step still runs)"
          else
            npm publish --provenance --access public
          fi

      # ── Register on the official MCP registry ───────────────────────────────
      - name: Sync server.json version to the tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version=$v | .packages[0].version=$v' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server to the MCP registry
        run: ./mcp-publisher publish
