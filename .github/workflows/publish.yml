name: publish

# On a v* tag: publish to npm with Sigstore provenance AND register on the
# official MCP registry — both via GitHub OIDC (trusted publishing / github-oidc),
# no stored secrets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # provenance + npm trusted publishing + MCP registry OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm >= 11.5; Node's bundled npm is older.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm install --no-audit --no-fund

      - name: Sanity — the CLI runs and inits a repo
        run: |
          node --check bin/psx-repotector.mjs
          tmp=$(mktemp -d) && cp -r src bin intent.schema.json package.json "$tmp"/ && cd "$tmp"
          git init -q && git config user.email ci@ci && git config user.name ci && git add -A && git commit -qm init
          node bin/psx-repotector.mjs init
          node bin/psx-repotector.mjs gates | grep -q INTENT_HONORED

      - name: Publish to npm (provenance via trusted publishing)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "repotector@$V" version >/dev/null 2>&1; then
            echo "repotector@$V already on npm — skipping (registry step still runs)"
          else
            npm publish --provenance --access public
          fi

      # ── Register on the official MCP registry ───────────────────────────────
      - name: Sync server.json version to the tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version=$v | .packages[0].version=$v' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server to the MCP registry
        run: ./mcp-publisher publish

  # ── Container image → GHCR ────────────────────────────────────────────────
  # Build amd64, smoke it against a real throwaway repo, then push
  # amd64+arm64. No stored secrets: GITHUB_TOKEN pushes to ghcr.io.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (amd64, local) for smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: repotector:smoke

      - name: Smoke — init + gates on a throwaway repo via the image
        run: |
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q && git config user.email ci@ci && git config user.name ci
          echo "export const hello = () => 'world'" > index.mjs
          git add -A && git commit -qm init
          docker run --rm -v "$tmp:/repo" repotector:smoke init
          docker run --rm -v "$tmp:/repo" repotector:smoke gates | grep -q INTENT_HONORED

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dir-ai/repotector:${{ steps.ver.outputs.version }}
            ghcr.io/dir-ai/repotector:latest
